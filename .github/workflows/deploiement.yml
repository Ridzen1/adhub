# Mise en ligne automatique d'AD'HUB sur o2switch.
#
# À chaque fusion dans main : vérification de la syntaxe PHP, puis envoi du
# contenu de src/ dans ~/adhub.fr par FTPS (lftp). Les fichiers propres au serveur (config/*.local.php, journaux,
# fichiers déposés) ne sont jamais envoyés, écrasés ni supprimés.
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   FTP_SERVER    ex. le nom du serveur o2switch indiqué dans cPanel
#   FTP_USERNAME  compte FTP dédié, limité au dossier adhub.fr
#   FTP_PASSWORD  mot de passe de ce compte
#
# Les migrations SQL (database/*.sql) ne sont PAS exécutées : elles sont
# signalées dans le résumé du déploiement, à passer dans phpMyAdmin.

name: Mise en ligne

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploiement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    name: Vérification PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Syntaxe de tous les fichiers PHP
        run: |
          erreurs=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || erreurs=1
          done < <(find src -name '*.php' -print0)
          exit $erreurs

  mise-en-ligne:
    name: Envoi sur o2switch
    needs: verification
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets présents ?
        id: secrets
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "pret=non" >> "$GITHUB_OUTPUT"
            echo "### Mise en ligne non faite" >> "$GITHUB_STEP_SUMMARY"
            echo "Les secrets FTP_SERVER, FTP_USERNAME et FTP_PASSWORD ne sont pas encore configurés." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      # lftp plutôt que FTP-Deploy-Action : avec o2switch, la connexion de données
      # FTPS de cette action est coupée (ECONNRESET). lftp gère correctement la
      # reprise de session TLS exigée par le serveur.
      - name: Envoi des fichiers
        if: steps.secrets.outputs.pret == 'oui'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Le certificat FTPS d'o2switch n'est pas reconnu par lftp (émetteur
          # inconnu) : on autorise uniquement CE certificat, par son empreinte.
          # Au renouvellement du certificat, l'envoi échoue en affichant la
          # nouvelle empreinte : la recopier ici après vérification.
          FTP_CERT_SHA1: '34:37:0F:D8:38:96:FE:AC:31:27:9E:6A:8C:5B:99:5E:0C:C9:17:A5'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$FTP_USERNAME" --env-password "ftp://$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:verify-certificate/$FTP_CERT_SHA1 no;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=3 --no-perms \
              --exclude-glob .git* \
              --exclude-glob *.local.php \
              --exclude-glob *.log \
              --exclude-glob cron/caisses/test_reel_reponse.json \
              ./src/ ./;
            quit
          "

      - name: Migrations SQL à passer
        if: always()
        run: |
          avant="${{ github.event.before }}"
          if [ -z "$avant" ] || ! git cat-file -e "$avant" 2>/dev/null; then
            avant=$(git rev-parse HEAD~1)
          fi
          nouvelles=$(git diff --name-only --diff-filter=A "$avant" HEAD -- 'database/*.sql' || true)
          if [ -n "$nouvelles" ]; then
            {
              echo "### ⚠️ Migrations SQL à exécuter dans phpMyAdmin"
              echo "Sauvegarder la base, puis importer dans l'ordre :"
              echo "$nouvelles" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Nouvelles migrations SQL à passer : $(echo $nouvelles)"
          fi
